services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  dagster:
    build:
      context: ./dagster
    ports: ["3000:3000"]
    environment:
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_PORT: "5432"
      DAGSTER_POSTGRES_DB: warehouse
      DAGSTER_POSTGRES_USER: dwh
      DAGSTER_POSTGRES_PASSWORD: dwh
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: warehouse
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      DBT_PROFILES_DIR: /workspace/dbt
    volumes:
      - ./dagster:/workspace/dagster
      - ./dbt:/workspace/dbt
      - dbt_packages:/dbt_packages_vol
      - ./extract:/workspace/extract
      - ./data:/workspace/data
      - ./scripts:/workspace/scripts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    ports: ["3001:3000"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_USER: dwh
      MB_DB_PASS: dwh
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  metabase-init:
    build:
      context: ./metabase-init
    environment:
      MB_HOST: http://metabase:3000
      MB_ADMIN_EMAIL: admin@demo.com
      MB_ADMIN_PASSWORD: Admin1234!
      MB_ADMIN_FIRST_NAME: Admin
      MB_ADMIN_LAST_NAME: Demo
      MB_SITE_NAME: "DWH Streaming - UDESA"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: warehouse
      PG_USER: metabase_ro
      PG_PASSWORD: metabase_ro
    depends_on:
      metabase:
        condition: service_healthy
    restart: "no"

  adminer:
    image: adminer:latest
    ports: ["8081:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  # --- Parte 2: Lineage ---
  # Genera y sirve el DAG de lineage de dbt en http://localhost:8082
  # Muestra el grafo bronze → silver → gold y permite navegar upstream/downstream.
  # Espera a que dagster instale dbt_packages antes de correr dbt docs generate.
  dbt-docs:
    build:
      context: ./dagster
    command: >
      bash -c "
        cd /workspace/dbt &&
        dbt deps --profiles-dir /workspace/dbt &&
        dbt docs generate --profiles-dir /workspace/dbt &&
        dbt docs serve --profiles-dir /workspace/dbt --port 8082 --host 0.0.0.0 --no-browser
      "
    ports: ["8082:8082"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: warehouse
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      DBT_PROFILES_DIR: /workspace/dbt
    volumes:
      - ./dbt:/workspace/dbt
      - dbt_packages:/dbt_packages_vol
    depends_on:
      postgres:
        condition: service_healthy
      dagster:
        condition: service_started
    restart: unless-stopped



  # --- Parte 1: Data Quality Dashboard (Elementary) ---
  # Sirve el reporte en http://localhost:8083/elementary_report.html
  # El reporte se genera corriendo desde dagster:
  #   docker compose exec dagster edr report --project-dir /workspace/dbt --profiles-dir /workspace/dbt --file-path /workspace/dbt/edr_target/elementary_report.html
  edr-report:
    image: python:3.12-slim
    command: >
      bash -c "
        mkdir -p /workspace/dbt/edr_target &&
        python -m http.server 8083 --directory /workspace/dbt/edr_target
      "
    ports: ["8083:8083"]
    volumes:
      - ./dbt:/workspace/dbt
    depends_on:
      dagster:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  metabase_data:
  dbt_packages:
