name: Deploy to EC2

on:
  push:
    branches:
      - feature/aws-cd

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: api
  EC2_INSTANCE_TAG: api
  PORT_MAPPING: "8000:8000"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build --target base -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS Credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR (to get registry URI)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Send Deployment Command to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Obtenemos la URI completa de la imagen
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

          echo "Enviando comando de despliegue a la EC2..."
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=${{ env.EC2_INSTANCE_TAG }}" \
            --parameters "{\"commands\":[
              \"sudo yum update -y\",
              \"sudo yum install docker -y || sudo amazon-linux-extras install docker -y\",
              \"sudo systemctl enable docker\",
              \"sudo systemctl start docker\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"sudo docker pull $IMAGE_URI\",
              \"sudo docker stop mi-app-contenedor || true\",
              \"sudo docker rm mi-app-contenedor || true\",
              \"sudo docker run -d --name mi-app-contenedor -p ${{ env.PORT_MAPPING }} $IMAGE_URI\"
            ]}" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Wait for the invocation to register
          sleep 5

          INSTANCE_ID=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "CommandInvocations[0].InstanceId" \
            --output text)

          echo "Instance ID: $INSTANCE_ID"

          # Wait until the command finishes (success or failure)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }}

          # Fetch result and fail the job if deployment failed
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi