[project]
name = "clases-ing-soft"
version = "0.1.0"
description = "API de ejemplo con FastAPI"
authors = [
    {name = "Autor",email = "autor@example.com"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "fastapi (>=0.129.0,<0.130.0)",
    "uvicorn[standard] (>=0.40.0,<0.41.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "pre-commit (>=4.0.0,<5.0.0)",
    "black (>=24.10.0,<25.0.0)",
    "flake8 (>=7.1.0,<8.0.0)",
    "pylint (>=3.3.0,<4.0.0)",
    "mypy (>=1.13.0,<2.0.0)"
]
