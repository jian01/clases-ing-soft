version: 2

models:
  - name: fact_streams
    description: "Fact table de eventos de streaming. Incremental por fecha."
    meta:
      owner: "equipo-analytics"
      team: "analytics"
    config:
      store_failures: true
    tests:
      - elementary.volume_anomalies:
          timestamp_column: "fecha"
          days_back: 30
      - elementary.freshness_anomalies:
          timestamp_column: "fecha"
          days_back: 30
    columns:
      - name: stream_id
        tests: [unique, not_null]
      - name: sk_cancion
        tests:
          - not_null
          - relationships:
              to: ref('dim_cancion')
              field: sk_cancion
      - name: sk_plataforma
        tests:
          - not_null
          - relationships:
              to: ref('dim_plataforma')
              field: sk_plataforma
      - name: sk_tiempo
        tests:
          - not_null
          - relationships:
              to: ref('dim_tiempo')
              field: sk_tiempo
      - name: reproducciones
        description: "Reproducciones del evento. Rango esperado: 100–50.000 por evento."
        tests:
          - not_null
          - elementary.column_anomalies:
              column_anomalies:
                - null_count
                - average
                - min_value
                - max_value
              min_training_set_size: 2
      - name: ingresos_usd
        description: "Ingresos generados en USD. Nunca negativo."
        meta:
          pii: false
        tests:
          - not_null
          - elementary.column_anomalies:
              column_anomalies:
                - null_count
                - average
                - min_value
                - max_value
              min_training_set_size: 2
      - name: pais_usuario
        description: "País del usuario (ISO 3166-1 alpha-2). Sensibilidad: baja."
        meta:
          pii: false
          sensitivity: "low"

  - name: dim_artista
    description: "Dimensión artista con SCD tipo 2. Cada cambio de género genera una fila nueva."
    meta:
      owner: "equipo-analytics"
      team: "analytics"
    columns:
      - name: sk_artista
        tests: [unique, not_null]
      - name: artista_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]

  - name: dim_cancion
    description: "Dimensión canción. SCD tipo 1."
    meta:
      owner: "equipo-analytics"
      team: "analytics"
    columns:
      - name: sk_cancion
        tests: [unique, not_null]
      - name: cancion_id
        tests: [not_null]

  - name: dim_plataforma
    description: "Dimensión plataforma. Cinco plataformas de streaming."
    meta:
      owner: "equipo-analytics"
      team: "analytics"
    columns:
      - name: sk_plataforma
        tests: [unique, not_null]
      - name: nombre
        tests:
          - not_null
          - accepted_values:
              values: ["Spotify", "YouTube", "Apple Music", "Tidal", "Amazon Music"]

  - name: dim_tiempo
    description: "Dimensión tiempo. Una fila por día desde 2024-01-01."
    meta:
      owner: "equipo-analytics"
      team: "analytics"
    columns:
      - name: sk_tiempo
        tests: [unique, not_null]
      - name: fecha
        tests: [unique, not_null]
